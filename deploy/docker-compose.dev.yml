# Dev stack, deployed by .github/workflows/deploy-dev.yml.
name: kilf-dev # fixed project name so it never collides with the prod stack on the same VPS
# Values come from the .env file the pipeline writes next to this file on the server.
# Ports bind to 127.0.0.1 only; put nginx/Caddy in front for HTTPS.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: kilf
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: kilf_dev
    volumes:
      - kilf_dev_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U kilf -d kilf_dev']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: ${IMAGE_PREFIX}-backend:${IMAGE_TAG}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://kilf:${POSTGRES_PASSWORD}@postgres:5432/kilf_dev?schema=public
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      FRONTEND_URL: ${FRONTEND_URL}
      API_URL: ${API_URL}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER}
      PAYMENT_SECRET: ${PAYMENT_SECRET}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
    ports:
      - '127.0.0.1:4100:4000'
    volumes:
      - kilf_dev_uploads:/app/uploads
    command: sh -c "npx prisma migrate deploy && node dist/server.js"

  admin-panel:
    image: ${IMAGE_PREFIX}-admin:${IMAGE_TAG}
    restart: unless-stopped
    ports:
      - '127.0.0.1:5273:5173'

volumes:
  kilf_dev_pgdata:
  kilf_dev_uploads:
