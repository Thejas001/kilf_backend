name: Deploy Production

# The "production" GitHub Environment should have Required reviewers on,
# so every prod deploy waits for a manual approval.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    env:
      HOST: ${{ secrets.PROD_HOST }}
      SSH_USER: ${{ secrets.PROD_USER }}
      SSH_PORT: ${{ secrets.PROD_SSH_PORT || '22' }}
    steps:
      - uses: actions/checkout@v4

      - name: Check config
        run: |
          for v in HOST SSH_USER; do
            [ -n "${!v}" ] || { echo "Missing secret PROD_$v on the 'production' environment"; exit 1; }
          done

      - name: Prepare SSH
        env:
          SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p "$SSH_PORT" "$HOST" >> ~/.ssh/known_hosts

      - name: Deploy on server
        run: |
          ssh -i ~/.ssh/id_deploy -p "$SSH_PORT" "$SSH_USER@$HOST" \
            DIR='${{ vars.PROD_DEPLOY_DIR }}' \
            SHA='${{ github.sha }}' \
            PM2_NAME='${{ vars.PROD_PM2_NAME || 'kilf-backend' }}' \
            PORT='${{ vars.PROD_PORT }}' \
            BUILD_ADMIN='${{ vars.PROD_BUILD_ADMIN || 'false' }}' \
            ADMIN_API_URL='${{ vars.PROD_API_URL }}' \
            'bash -s' < deploy/remote-deploy.sh

      - name: Smoke test
        env:
          API_URL: ${{ vars.PROD_API_URL }}
        run: |
          for i in $(seq 1 12); do
            if curl -fsS "$API_URL/health"; then exit 0; fi
            sleep 5
          done
          echo "Health check failed"; exit 1
