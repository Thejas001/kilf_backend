name: CI

on:
  pull_request:
  workflow_call: # reused by deploy-dev.yml so deploys only happen after CI passes

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kilf
          POSTGRES_PASSWORD: kilf
          POSTGRES_DB: kilf_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U kilf"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # backend/.env.test is gitignored, so CI supplies the test config here.
      NODE_ENV: test
      DATABASE_URL: postgresql://kilf:kilf@localhost:5432/kilf_test?schema=public
      JWT_SECRET: ci-test-jwt-secret-value
      JWT_REFRESH_SECRET: ci-test-refresh-secret-value
      PAYMENT_PROVIDER: mock
      PAYMENT_SECRET: ci-mock-payment-secret
      UPLOAD_DIR: uploads-test
      LOG_LEVEL: silent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npx prisma migrate deploy
      - run: npm test
      - run: npm run build

  admin-panel:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-panel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: admin-panel/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
