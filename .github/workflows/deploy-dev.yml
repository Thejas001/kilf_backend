name: Deploy Dev

on:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      prefix: ${{ steps.meta.outputs.prefix }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: echo "prefix=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ steps.meta.outputs.prefix }}-backend:dev
            ${{ steps.meta.outputs.prefix }}-backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
      - uses: docker/build-push-action@v6
        with:
          context: ./admin-panel
          push: true
          build-args: VITE_API_URL=${{ vars.DEV_API_URL }}
          tags: |
            ${{ steps.meta.outputs.prefix }}-admin:dev
            ${{ steps.meta.outputs.prefix }}-admin:${{ github.sha }}
          cache-from: type=gha,scope=admin
          cache-to: type=gha,scope=admin,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: dev # secrets/vars below come from the "dev" GitHub Environment
    permissions:
      contents: read
    env:
      HOST: ${{ secrets.DEV_HOST }}
      SSH_USER: ${{ secrets.DEV_USER }}
      SSH_PORT: ${{ secrets.DEV_SSH_PORT || '22' }}
      DIR: ${{ vars.DEV_DEPLOY_DIR || '/opt/kilf-dev' }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepare SSH
        env:
          SSH_KEY: ${{ secrets.DEV_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p "$SSH_PORT" "$HOST" >> ~/.ssh/known_hosts

      - name: Render .env for the server
        env:
          IMAGE_PREFIX: ${{ needs.build.outputs.prefix }}
          IMAGE_TAG: ${{ github.sha }}
          POSTGRES_PASSWORD: ${{ secrets.DEV_POSTGRES_PASSWORD }}
          JWT_SECRET: ${{ secrets.DEV_JWT_SECRET }}
          JWT_REFRESH_SECRET: ${{ secrets.DEV_JWT_REFRESH_SECRET }}
          FRONTEND_URL: ${{ vars.DEV_FRONTEND_URL }}
          API_URL: ${{ vars.DEV_API_URL }}
          PAYMENT_PROVIDER: ${{ vars.DEV_PAYMENT_PROVIDER || 'mock' }}
          PAYMENT_SECRET: ${{ secrets.DEV_PAYMENT_SECRET }}
          RAZORPAY_KEY_ID: ${{ secrets.DEV_RAZORPAY_KEY_ID }}
          RAZORPAY_KEY_SECRET: ${{ secrets.DEV_RAZORPAY_KEY_SECRET }}
          RAZORPAY_WEBHOOK_SECRET: ${{ secrets.DEV_RAZORPAY_WEBHOOK_SECRET }}
        run: |
          for v in IMAGE_PREFIX IMAGE_TAG POSTGRES_PASSWORD JWT_SECRET JWT_REFRESH_SECRET \
                   FRONTEND_URL API_URL PAYMENT_PROVIDER PAYMENT_SECRET \
                   RAZORPAY_KEY_ID RAZORPAY_KEY_SECRET RAZORPAY_WEBHOOK_SECRET; do
            printf '%s=%s\n' "$v" "${!v}"
          done > .env.dev

      - name: Ship files and restart stack
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          KEY=~/.ssh/id_deploy
          TARGET="$SSH_USER@$HOST"
          ssh -i "$KEY" -p "$SSH_PORT" "$TARGET" "mkdir -p '$DIR'"
          scp -i "$KEY" -P "$SSH_PORT" deploy/docker-compose.dev.yml "$TARGET:$DIR/docker-compose.yml"
          scp -i "$KEY" -P "$SSH_PORT" .env.dev "$TARGET:$DIR/.env"
          # The GHCR token is sent over stdin so it never appears in a command line.
          printf '%s' "$GHCR_TOKEN" | ssh -i "$KEY" -p "$SSH_PORT" "$TARGET" \
            "cd '$DIR' && chmod 600 .env \
             && docker login ghcr.io -u '$GHCR_USER' --password-stdin \
             && docker compose pull && docker compose up -d --remove-orphans \
             && docker image prune -f"

      - name: Smoke test
        env:
          API_URL: ${{ vars.DEV_API_URL }}
        run: |
          for i in $(seq 1 12); do
            if curl -fsS "$API_URL/health"; then exit 0; fi
            sleep 5
          done
          echo "Health check failed"; exit 1
