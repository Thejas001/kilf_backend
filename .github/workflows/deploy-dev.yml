name: Deploy Dev

on:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: read
    env:
      HOST: ${{ secrets.DEV_HOST }}
      SSH_USER: ${{ secrets.DEV_USER }}
      SSH_PORT: ${{ secrets.DEV_SSH_PORT || '22' }}
    steps:
      - uses: actions/checkout@v4

      - name: Check config
        run: |
          for v in HOST SSH_USER; do
            [ -n "${!v}" ] || { echo "Missing secret DEV_$v on the 'dev' environment"; exit 1; }
          done

      - name: Prepare SSH
        env:
          SSH_KEY: ${{ secrets.DEV_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p "$SSH_PORT" "$HOST" >> ~/.ssh/known_hosts

      - name: Deploy on server
        run: |
          ssh -i ~/.ssh/id_deploy -p "$SSH_PORT" "$SSH_USER@$HOST" \
            DIR='${{ vars.DEV_DEPLOY_DIR || '/opt/kilf-dev' }}' \
            SHA='${{ github.sha }}' \
            PM2_NAME='${{ vars.DEV_PM2_NAME || 'kilf-backend-dev' }}' \
            PORT='${{ vars.DEV_PORT || '4100' }}' \
            BUILD_ADMIN='${{ vars.DEV_BUILD_ADMIN || 'false' }}' \
            ADMIN_API_URL='${{ vars.DEV_API_URL }}' \
            'bash -s' < deploy/remote-deploy.sh

      - name: Smoke test
        env:
          API_URL: ${{ vars.DEV_API_URL }}
        run: |
          for i in $(seq 1 12); do
            if curl -fsS "$API_URL/health"; then exit 0; fi
            sleep 5
          done
          echo "Health check failed"; exit 1
